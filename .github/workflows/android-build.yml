name: Build PUBG Damage Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes the Android SDK.
      # Skip android-actions/setup-android because it failed previously.
      - name: Extract Android project
        run: |
          unzip -q PUBG_Damage_Tracker_Android_Project.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/PUBG_Damage_Tracker
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-Damage-Tracker-APK
          path: source/PUBG_Damage_Tracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
